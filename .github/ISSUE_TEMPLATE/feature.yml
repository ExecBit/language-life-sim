name: Playable feature
description: A player-facing experiment with small, measurable acceptance criteria
title: "[LEX] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Player-facing goal
      description: What can the player understand or do after this change?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Keep this narrow. Avoid introducing incidental engine or tooling projects.
    validations:
      required: true
  - type: textarea
    id: words
    attributes:
      label: Target words and situations
      description: Name lexemes and different contexts/actions when relevant.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Prefer observable player behavior and short risk-based checks.
    validations:
      required: true
