name: Lightweight checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Godot skeleton and workflow files
        run: |
           test -f project.godot
           test -f scenes/main.tscn
           test -f AGENTS.md
           test -f .github/ISSUE_TEMPLATE/feature.yml
           test -f data/room/lex01_room.json
           python3 - <<'PY'
           from pathlib import Path
           import json

           def has_cyrillic(text):
               return any(0x400 <= ord(ch) <= 0x4FF for ch in str(text))

           project = Path('project.godot').read_text(encoding='utf-8')
           scene = Path('scenes/main.tscn').read_text(encoding='utf-8')
           assert 'run/main_scene="res://scenes/main.tscn"' in project
           assert '[node name="LanguageLifeSim" type="Node3D"]' in scene
           # TAV-02 (Issue #9): the room is walked through now, so the shipped scene has to carry
           # the two things a first-person room needs - a player body and a room shell to collide
           # with - and the input map has to declare the keys the controls read.
           assert '[node name="RoomShell" type="StaticBody3D"' in scene, 'scenes/main.tscn has no room shell to collide with'
           assert 'scenes/fps_player.tscn' in scene, 'scenes/main.tscn does not instance the first-person player'
           assert Path('scripts/fps_player.gd').is_file() and Path('scenes/fps_player.tscn').is_file(), 'the first-person rig is missing'
           for action in ('move_forward', 'move_back', 'move_left', 'move_right', 'interact', 'toggle_cursor', 'hint', 'skip_task', 'open_help'):
               assert action in project, 'project.godot does not declare the %s input action' % action
           print('Bootstrap structure OK; Godot runtime NOT_TESTED by CI.')

           # Vocabulary handoff from PREP-01 (Issue #4).
           vocab = json.loads(Path('data/vocabulary/de_a1_starter.json').read_text(encoding='utf-8'))

           lemmas = vocab['lemmas']
           assert vocab['lemma_count'] == len(lemmas), 'lemma_count mismatch'
           assert 35 <= len(lemmas) <= 50, 'lemma count %d' % len(lemmas)
           lemma_ids = {lemma['id'] for lemma in lemmas}
           assert len(lemma_ids) == len(lemmas), 'duplicate lemma id'
           # TAV-01 (Issue #8): a curriculum of clickable nouns alone would teach objects and not
           # the words that carry a situation, so the part of speech has to be mixed.
           pos_counts = {}
           for lemma in lemmas:
               pos_counts[lemma['pos']] = pos_counts.get(lemma['pos'], 0) + 1
           assert pos_counts.get('verb', 0) >= 8, 'only %d verbs in the corpus: a noun-only curriculum cannot express a tavern shift' % pos_counts.get('verb', 0)
           assert pos_counts.get('adjective', 0) >= 4, 'only %d adjectives in the corpus' % pos_counts.get('adjective', 0)
           assert pos_counts.get('preposition', 0) + pos_counts.get('adverb', 0) >= 3, 'only %d prepositions and adverbs in the corpus' % (pos_counts.get('preposition', 0) + pos_counts.get('adverb', 0))
           assert pos_counts.get('noun', 0) < len(lemmas), 'the corpus is noun-only'
           declared_shape = vocab.get('corpus_shape', {}).get('by_pos')
           if declared_shape is not None:
               assert declared_shape == pos_counts, 'corpus_shape claims %s but the lemma records give %s' % (declared_shape, pos_counts)
               assert sum(declared_shape.values()) == len(lemmas), 'corpus_shape does not add up to %d lemmas' % len(lemmas)
           lemma_objects = {}
           for lemma in lemmas:
               assert lemma['verified_in_source'] is True, 'unverified lemma %s' % lemma['id']
               for key in ('lemma', 'pos', 'sample_form', 'en', 'source_entry', 'source_page'):
                   assert lemma.get(key) not in (None, ''), '%s missing %s' % (lemma['id'], key)
               # Every lemma now needs a Russian meaning, not only the ones with a prop model:
               # verbs, adjectives and expressions have no object to point at, so the hint text is
               # the only place a beginner can find out what the word means.
               assert lemma.get('ru') and has_cyrillic(lemma['ru']), 'lemma %s has no Russian meaning' % lemma['id']
               # TAV-01 records how the source printed a word: as its own entry, or as an indented
               # Nebeneintrag / Redewendung under a headword. A sub-entry has to name its parent.
               source_kind = lemma.get('source_kind', 'headword')
               assert source_kind in ('headword', 'nebeneintrag', 'redewendung'), 'lemma %s claims unknown source_kind %s' % (lemma['id'], source_kind)
               if source_kind != 'headword':
                   assert lemma.get('source_parent'), 'lemma %s is a %s but names no source_parent' % (lemma['id'], source_kind)
               if lemma.get('scene_object'):
                   assert Path(lemma['scene_object'].replace('res://', '')).is_file(), lemma['scene_object']
               lemma_objects[lemma['id']] = lemma.get('scene_object')

           # The reserve pool is a claim about the source, not about the curriculum: every entry has
           # to name the page it was verified on, and a sub-entry has to name its parent.
           for entry in vocab.get('reserve_pool', {}).get('entries', []):
               assert entry.get('lemma') and entry.get('source_page') and entry.get('hold_reason'), 'reserve entry without lemma, source_page or hold_reason: %s' % entry
               assert entry.get('source_kind') in ('headword', 'nebeneintrag', 'redewendung'), 'reserve entry %s has an unknown source_kind' % entry['lemma']
               if entry['source_kind'] != 'headword':
                   assert entry.get('source_parent'), 'reserve entry %s is a %s but names no source_parent' % (entry['lemma'], entry['source_kind'])
               assert entry['lemma'] not in lemma_ids, 'reserve entry %s is also a committed lemma' % entry['lemma']

           allowed = {'find_select', 'bring_deliver', 'respond'}

           # The interface text is a shipped data file, so its shape is guarded the same way the
           # scenario and vocabulary files are: a missing button label or a missing action
           # instruction would otherwise only show up as an empty control in the game.
           ui = json.loads(Path('data/ui/lex01_ui_ru.json').read_text(encoding='utf-8'))
           for section in ('onboarding', 'action_prompts', 'buttons', 'lines', 'stat_labels'):
               assert isinstance(ui.get(section), dict), 'interface text missing the %s section' % section
           assert set(ui['action_prompts']) == allowed, 'interface text must carry exactly one instruction per action type, found %s' % sorted(ui['action_prompts'])
           for key, instruction in ui['action_prompts'].items():
               assert instruction.strip() and has_cyrillic(instruction), 'action instruction for %s is empty or not in the interface language' % key
           # TAV-02 (Issue #9): keyboard shortcuts and a pause menu only stay reachable if their
           # labels exist in data, so the pause buttons are guarded like every other control.
           for key in ('continue', 'skip', 'end_day', 'next_day', 'reset', 'help', 'hint', 'close_onboarding', 'pause_resume', 'pause_new_run', 'pause_quit'):
               value = ui['buttons'].get(key, '')
               assert value.strip(), 'interface text missing the button label %s' % key
               # The ? button is a symbol by design; every other control has to read as Russian.
               if key != 'help':
                   assert has_cyrillic(value), 'button label %s contains no Cyrillic: %s' % (key, value)
           for key in ('briefing_hint', 'guided', 'gloss_prefix', 'held', 'delivery_hint', 'nothing_held', 'skipped', 'retry', 'assisted', 'unaided'):
               assert str(ui['lines'].get(key, '')).strip(), 'interface text missing the line %s' % key
           # Aiming needs its two cues and an always-on control reminder: a first-person player who
           # cannot tell "nothing aimed" from "too far" has no way to find out what went wrong.
           for key in ('controls_hint', 'target_none', 'target_too_far', 'interact_hint', 'paused_note'):
               value = str(ui['lines'].get(key, ''))
               assert value.strip() and has_cyrillic(value), 'interface text missing the aiming line %s' % key
           for key in ('interact_take', 'interact_deliver'):
               value = str(ui['lines'].get(key, ''))
               assert value.strip() and has_cyrillic(value) and '%s' in value, 'interface text %s must name the object with a %%s placeholder' % key
           assert ui['onboarding'].get('title', '').strip() and has_cyrillic(ui['onboarding']['title']), 'onboarding needs a title in the interface language'
           assert len(ui['onboarding'].get('lines', [])) >= 3, 'onboarding explains fewer than three steps'
           for index, line in enumerate(ui['onboarding']['lines']):
               assert str(line).strip() and has_cyrillic(line), 'onboarding line %d is empty or not in the interface language' % index
           for script in ('scripts/lex01_game.gd', 'scripts/lex01_hud.gd', 'scripts/lex01_progress.gd', 'scripts/fps_player.gd'):
               body = Path(script).read_text(encoding='utf-8')
               assert not has_cyrillic(body), '%s contains interface text, which belongs in data/ui/lex01_ui_ru.json' % script
               assert 'Klicke' not in body and 'bersprungen' not in body, '%s still hard-codes a German instruction' % script
           print('Interface text OK: %d action instructions, %d buttons, %d onboarding steps.' % (
               len(ui['action_prompts']), len(ui['buttons']), len(ui['onboarding']['lines'])))
           def validate_scenario(scenario):
               action = scenario['action_type']
               assert action in allowed, 'bad action_type in %s' % scenario['id']
               assert scenario['utterance_de'], 'empty utterance in %s' % scenario['id']
               # The German prompt is what is learned, but a beginner has to be able to find out
               # what it asks, and the hint button is only honest if that meaning exists in data.
               assert scenario.get('utterance_gloss_ru') and has_cyrillic(scenario['utterance_gloss_ru']), 'no Russian meaning of the German prompt in %s' % scenario['id']
               assert scenario['feedback_correct_de'] and scenario['feedback_wrong_de'], 'missing feedback in %s' % scenario['id']
               for lemma_id in scenario['target_lemma_ids']:
                   assert lemma_id in lemma_ids, 'unknown target lemma in %s' % scenario['id']
               if scenario.get('verb_lemma_id'):
                   assert scenario['verb_lemma_id'] in lemma_ids, 'unknown verb lemma in %s' % scenario['id']
               option_ids = [option['id'] for option in scenario['options']]
               assert len(option_ids) >= 2, 'fewer than two options in %s' % scenario['id']
               assert len(set(option_ids)) == len(option_ids), 'duplicate option id in %s' % scenario['id']
               assert option_ids == [chr(ord('a') + i) for i in range(len(option_ids))], 'option ids must stay the positional labels a/b/c in %s' % scenario['id']
               assert scenario['correct_option_id'] in option_ids, 'bad correct_option_id in %s' % scenario['id']
               # distractor_note: distractor_lemma_ids = lemmas of the incorrect options
               # minus the lemmas of the correct option. An empty list is valid (s13).
               correct_option = scenario['options'][option_ids.index(scenario['correct_option_id'])]
               wrong_lemmas = set()
               for option in scenario['options']:
                   if option['id'] != scenario['correct_option_id']:
                       wrong_lemmas.update(option['lemma_ids'])
               derived = sorted(wrong_lemmas - set(correct_option['lemma_ids']))
               assert derived == sorted(scenario['distractor_lemma_ids']), 'distractor_lemma_ids mismatch in %s: stored %s, derived %s' % (scenario['id'], sorted(scenario['distractor_lemma_ids']), derived)
               for option in scenario['options']:
                   assert option['label_de'], 'option without label in %s' % scenario['id']
                   for lemma_id in option['lemma_ids']:
                       assert lemma_id in lemma_ids, 'unknown option lemma in %s' % scenario['id']
                   if action == 'respond':
                       # A spoken answer is a whole German sentence, so it needs a meaning of its
                       # own; an object answer gets its meaning from the lemma instead.
                       assert option.get('gloss_ru') and has_cyrillic(option['gloss_ru']), 'respond option %s has no Russian meaning in %s' % (option['id'], scenario['id'])
                   if action != 'respond':
                       assert Path(option['scene_object'].replace('res://', '')).is_file(), option['scene_object']
               target = scenario.get('delivery_target')
               if isinstance(target, dict):
                   if target['kind'] == 'npc':
                       assert target['npc'] in room['npcs'], 'delivery_target names an unknown npc in %s' % scenario['id']
                   else:
                       assert Path(target['scene_object'].replace('res://', '')).is_file(), 'delivery_target model missing in %s' % scenario['id']
               state = scenario.get('scene_state') or {}
               for key, value in state.items():
                   if key in ('focus_object', 'compared_object'):
                       assert Path(str(value).replace('res://', '')).is_file(), 'scene_state %s model missing in %s' % (key, scenario['id'])
                       continue
                   if key == 'size_evidence':
                       continue
                   assert key in lemma_objects, 'scene_state key %s is not a known lemma in %s' % (key, scenario['id'])
                   assert lemma_objects[key], 'scene_state lemma %s has no prop model in %s' % (key, scenario['id'])
                   assert Path(lemma_objects[key].replace('res://', '')).is_file(), 'scene_state model missing in %s' % scenario['id']
                   assert value in room['placement_slots'], 'scene_state slot %s is not declared in data/room/lex01_room.json (%s)' % (value, scenario['id'])

           # The room layout is data too: LEX-01 places objects from it, so its own references
           # have to be checked or a scenario could name a surface that does not exist.
           room = json.loads(Path('data/room/lex01_room.json').read_text(encoding='utf-8'))
           for section in ('npcs', 'cameras', 'candidate_slots', 'anchors', 'placement_slots', 'hold', 'delivery', 'player'):
               assert isinstance(room.get(section), dict), 'room layout missing the %s section' % section
           # TAV-02 (Issue #9): the first-person body and its reach are data, not constants, so a
           # broken tunable is caught here instead of becoming a player who cannot move, cannot see
           # over the furniture, or cannot ever reach an answer.
           player = room['player']
           for key in ('eye_height', 'walk_speed', 'interact_range'):
               value = player.get(key)
               assert isinstance(value, (int, float)) and value > 0, 'room layout player.%s must be a positive number, got %s' % (key, value)
           assert player['eye_height'] > 1.0, 'room layout player.eye_height of %s puts the crosshair at the floor' % player['eye_height']
           assert player['interact_range'] <= 20.0, 'room layout player.interact_range of %s makes aiming a distance instead of an approach' % player['interact_range']
           assert 0 < player.get('pitch_limit_deg', 0) <= 90, 'room layout player.pitch_limit_deg has to stay between 0 and 90 degrees'
           # `cameras` keeps its name from LEX-01 but is read as where the player is put down per
           # context, so a spawn outside the room or below the floor is a data error.
           for context, camera in room['cameras'].items():
               if context == 'note':
                   continue
               position = camera.get('position')
               assert isinstance(position, list) and len(position) == 3, 'spawn for context %s has no position: %s' % (context, camera)
               assert position[1] >= 0.0, 'spawn for context %s is below the floor: %s' % (context, position)
               assert abs(position[0]) < 9.0 and abs(position[2]) < 9.0, 'spawn for context %s stands outside the room: %s' % (context, position)
           for name, npc in room['npcs'].items():
               assert Path(npc['scene'].replace('res://', '')).is_file(), 'npc %s model missing' % name
               assert npc.get('label_de'), 'npc %s has no label_de' % name
           for name, slot in room['placement_slots'].items():
               anchor = slot.get('anchor')
               assert Path(str(anchor).replace('res://', '')).is_file(), 'placement slot %s anchor missing: %s' % (name, anchor)
               assert anchor in room['anchors'], 'placement slot %s anchor has no position data: %s' % (name, anchor)
               assert slot.get('mode') in ('on_top', 'at_front'), 'placement slot %s uses an unknown mode %s' % (name, slot.get('mode'))
           # TAV-03 (Issue #10): the tavern itself is data. The room is assembled from the interior
           # section at run time, so a wrong model path or a bad position here is a room with a hole
           # in it, and it is named here instead of showing up as missing furniture.
           interior = room.get('interior')
           assert isinstance(interior, list) and interior, 'room layout has no interior entries: the tavern would be an empty test room'
           solid_count = 0
           for entry in interior:
               assert isinstance(entry, dict), 'interior entry is not an object: %s' % entry
               model = str(entry.get('model', ''))
               assert Path(model.replace('res://', '')).is_file(), 'interior entry has no model file: %s' % model
               position = entry.get('position')
               assert isinstance(position, list) and len(position) == 3, 'interior entry %s has no position: %s' % (model, position)
               assert abs(position[0]) < 9.0 and abs(position[2]) < 9.0, 'interior entry %s stands outside the room: %s' % (model, position)
               for key in ('solid', 'ground'):
                   if key in entry:
                       assert isinstance(entry[key], bool), 'interior entry %s declares %s as something other than true or false' % (model, key)
               rotation = entry.get('rotation_deg')
               if rotation is not None:
                   assert isinstance(rotation, list) and len(rotation) == 3, 'interior entry %s declares rotation_deg as %s' % (model, rotation)
               if entry.get('solid'):
                   solid_count += 1
               solid_members = entry.get('solid_members', [])
               assert isinstance(solid_members, list), 'interior group %s declares solid_members as something other than a list' % model
               solid_count += len(solid_members)
               member_ids = entry.get('member_ids', {})
               assert isinstance(member_ids, dict), 'interior group %s declares member_ids as something other than an object' % model
           # Solid means "the player walks into it". The fixed tavern uses two bar sections and one
           # preparation counter; guest furniture stays walk-through so tasks cannot trap a player.
           assert 3 <= solid_count <= 8, 'interior declares %d solid pieces; expected fixed counter furniture' % solid_count
           # Stable instance ids: a placement slot or a delivery target that addresses one
           # specific piece of authored furniture by id must name an id the interior declares,
           # or the station would silently resolve to whichever piece shares the model.
           interior_ids = {e.get('id') for e in interior if isinstance(e, dict) and e.get('id')}
           interior_ids.update(member_id for e in interior if isinstance(e, dict) for member_id in e.get('member_ids', {}).values())
           for name, slot in room['placement_slots'].items():
               anchor_id = slot.get('anchor_id')
               if anchor_id:
                   assert anchor_id in interior_ids, 'placement slot %s names unknown interior instance %s' % (name, anchor_id)
           assert len(room['npcs']) >= 3, 'the tavern room has %d npcs, expected at least three so the room reads as a place with people in it' % len(room['npcs'])
           for context in ('default', 'room', 'kitchen'):
               slots = room['candidate_slots'].get(context)
               assert isinstance(slots, list) and len(slots) >= 2, 'candidate_slots.%s needs at least two positions' % context
               for slot in slots:
                   assert isinstance(slot, list) and len(slot) == 3, 'candidate slot in %s is not a position: %s' % (context, slot)
           # LEX-01 (Issue #2) reads every scenario file in the directory, which is what makes a
           # new learning situation a data change instead of a code change. So the directory is
           # validated as a whole, not just the file PREP-01 delivered.
           starter = json.loads(Path('data/scenarios/lex01_starter.json').read_text(encoding='utf-8'))
           starter_scenarios = starter['scenarios']
           assert starter['scenario_count'] == len(starter_scenarios), 'scenario_count mismatch in the starter file'
           assert len(starter_scenarios) == 15, 'starter scenario count %d' % len(starter_scenarios)
           scenario_files = sorted(Path('data/scenarios').glob('*.json'))
           assert len(scenario_files) >= 2, 'the loader needs more than one scenario file to prove data-only loading: %s' % [p.name for p in scenario_files]
           all_scenarios = []
           for path in scenario_files:
               document = json.loads(path.read_text(encoding='utf-8'))
               scenarios = document['scenarios']
               assert document['scenario_count'] == len(scenarios), 'scenario_count mismatch in %s' % path.name
               # A file that only repeats existing records proves nothing about learning value.
               assert scenarios, 'no scenarios in %s' % path.name
               assert document.get('presentation_note'), 'presentation_note missing in %s (LEX-01 must shuffle option order)' % path.name
               assert document.get('distractor_note'), 'distractor_note missing in %s (distractor_lemma_ids needs a documented rule)' % path.name
               for scenario in scenarios:
                   validate_scenario(scenario)
               all_scenarios.extend(scenarios)
           assert len(all_scenarios) >= 16, 'only %d scenarios loaded from %s' % (len(all_scenarios), [p.name for p in scenario_files])
           # Scenario ids are the keys of Lex01Progress.scenario_log: a duplicate across two files
           # would silently merge two learning situations into one progress entry, so it is refused
           # here as well as by the in-game loader.
           all_ids = [s['id'] for s in all_scenarios]
           assert len(set(all_ids)) == len(all_ids), 'duplicate scenario id across scenario files: %s' % sorted({i for i in all_ids if all_ids.count(i) > 1})

           # The first card a player ever sees is decided in data, so CI guards it too: exactly one
           # record may claim it, and it has to be a task a beginner can actually do first.
           guided = [s for s in all_scenarios if s.get('guided')]
           assert len(guided) == 1, 'expected exactly one guided record, found %s' % [s['id'] for s in guided]
           first_day = min(s['day'] for s in all_scenarios)
           assert guided[0]['day'] == first_day, 'the guided record %s must belong to the first day (%d), it is on day %d' % (guided[0]['id'], first_day, guided[0]['day'])
           assert guided[0]['action_type'] == 'find_select', 'the guided record %s must be a find_select task, it is %s' % (guided[0]['id'], guided[0]['action_type'])
           glossed = sum(1 for s in all_scenarios if s.get('utterance_gloss_ru'))
           glossed_options = sum(1 for s in all_scenarios if s['action_type'] == 'respond' for option in s['options'] if option.get('gloss_ru'))
           assert glossed == len(all_scenarios), 'only %d of %d scenarios carry a Russian meaning of their prompt' % (glossed, len(all_scenarios))
           assert glossed_options >= 12, 'only %d answer sentences carry a Russian meaning' % glossed_options

           used_actions = set()
           contexts = {}
           correct_positions = {}
           for scenario in all_scenarios:
               used_actions.add(scenario['action_type'])
               correct_positions[scenario['correct_option_id']] = correct_positions.get(scenario['correct_option_id'], 0) + 1
               for lemma_id in scenario['target_lemma_ids']:
                   contexts.setdefault(lemma_id, set()).add((scenario['context'], scenario['action_type']))
           assert used_actions == {'find_select', 'bring_deliver', 'respond'}, 'action types covered: %s' % sorted(used_actions)
           # No answer position may be correct in half or more records, and a fixed
           # position would make the test solvable without understanding German.
           most_common = max(correct_positions.values())
           assert most_common * 2 <= len(all_scenarios), 'correct answer sits in one position in %d of %d records' % (most_common, len(all_scenarios))
           assert len(correct_positions) >= 3, 'only %d distinct correct-answer positions' % len(correct_positions)
           repeated = sorted(lemma_id for lemma_id, pairs in contexts.items() if len(pairs) >= 2)
           assert len(repeated) >= 5, 'only %d lemmas recur in two contexts' % len(repeated)
           assert any(s.get('revisit_of') for s in all_scenarios), 'no day-2 revisit recorded'
           revisits = sorted(s['id'] for s in all_scenarios if s.get('revisit_of'))
           revisit_sources = {s['revisit_of'] for s in all_scenarios if s.get('revisit_of')}
           known_ids = {s['id'] for s in all_scenarios}
           assert revisit_sources <= known_ids, 'revisit_of points at a scenario that does not exist: %s' % sorted(revisit_sources - known_ids)
           assert len(revisits) >= 5, 'only %d scenarios are day-2 revisits' % len(revisits)
           for context in sorted({s['context'] for s in all_scenarios}):
               slots = room['candidate_slots'].get(context, room['candidate_slots'].get('default', []))
               assert len(slots) >= 2, 'context %s has fewer than two candidate positions' % context
               assert context in room['cameras'] or 'default' in room['cameras'], 'context %s has no camera' % context
           print('Content OK: %d lemmas %s, %d scenario files, %d scenarios, %d lemmas recurring in two contexts, %d day-2 revisits, %d glossed prompts, %d glossed answer sentences, guided=%s, correct-answer positions %s.' % (
               len(lemmas), sorted('%s=%d' % pair for pair in pos_counts.items()), len(scenario_files), len(all_scenarios), len(repeated), len(revisits), glossed, glossed_options, guided[0]['id'], correct_positions))
           PY
