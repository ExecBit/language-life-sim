name: Godot MVP checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check migrated structure
        run: python implementations/dormitory/tools/check_repository.py
      - name: Install Godot 4.7.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import without private assets or a pre-existing cache
        run: '$GODOT --headless --path . --editor --import'
      - name: Run gameplay regressions
        run: python implementations/dormitory/tools/run_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation
          path: .local/validation/
